name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.0.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: repos-manager-linux-x86_64.tar.gz
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: repos-manager-linux-aarch64.tar.gz
            zigbuild: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: repos-manager-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: repos-manager-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: repos-manager-windows-x86_64.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install zig and cargo-zigbuild
        if: matrix.zigbuild
        run: bash scripts/install-zigbuild.sh >> "$GITHUB_PATH"

      - name: Build
        run: |
          if [[ "${{ matrix.zigbuild }}" == "true" ]]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: bash scripts/package.sh ${{ matrix.target }} ${{ matrix.asset }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Build Windows installer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
          version="${TAG#v}"
          unzip -o dist/repos-manager-windows-x86_64.zip repos-manager.exe -d build-nsis
          makensis -V2 \
            -DVERSION="$version" \
            -DVIVERSION="${version%%[-+]*}.0" \
            -DBINARY="$PWD/build-nsis/repos-manager.exe" \
            -DOUTFILE="$PWD/dist/repos-manager-windows-x86_64-setup.exe" \
            install/windows/repos-manager.nsi

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip *.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          version="${TAG#v}"
          awk -v h="## v${version}" '$0 == h { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Release ${TAG}" > notes.md
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
          fi
