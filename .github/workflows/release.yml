# Runs on the GitHub mirror when a v* tag arrives from Forgejo.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to find the highest version below

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      # A release that already exists for this tag (a re-run, or a tag pushed
      # again after a fix) is replaced. The tag itself is kept.
      - name: Create the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing it"
            gh release delete "$TAG" --yes
          fi
          # Only the highest version is marked "latest", which is what
          # releases/latest (install.sh and the self-updater) resolve to.
          # Without this, an older tag rebuilt later would take over.
          highest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          latest=false
          [ "$highest" = "$TAG" ] && latest=true
          echo "Highest tag is $highest, latest=$latest"
          gh release create "$TAG" --generate-notes --verify-tag --latest="$latest"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, arch: x86_64 }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp LICENSE readme.md target/${{ matrix.target }}/release/repos-manager dist/
          tar -czf repos-manager-${{ matrix.target }}.tar.gz -C dist LICENSE readme.md repos-manager

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp LICENSE readme.md target/${{ matrix.target }}/release/repos-manager.exe dist/
          (cd dist && 7z a ../repos-manager-${{ matrix.target }}.zip LICENSE readme.md repos-manager.exe)

      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $version = "$env:TAG".TrimStart('v')
          $numeric = ($version -split '[-+]')[0]
          makensis /V2 "/DVERSION=$version" "/DVIVERSION=$numeric.0" "/DARCH=${{ matrix.arch }}" `
            "/DBINARY=..\target\${{ matrix.target }}\release\repos-manager.exe" `
            "/DOUTFILE=..\repos-manager-${{ matrix.arch }}-setup.exe" `
            installers\repos-manager.nsi

      - name: Upload
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber repos-manager-*.{tar.gz,zip} repos-manager-*-setup.exe

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Hash archives and binaries
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'repos-manager-*'
          sha256sum repos-manager-* > SHA256SUMS

          # Hash the binary inside each archive, listed as <target>/<binary>.
          for archive in repos-manager-*.tar.gz repos-manager-*.zip; do
            target=${archive#repos-manager-}
            target=${target%.tar.gz}
            target=${target%.zip}
            mkdir -p "bin/$target"
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "bin/$target" repos-manager ;;
              *.zip)    unzip -q "$archive" repos-manager.exe -d "bin/$target" ;;
            esac
          done
          (cd bin && sha256sum */repos-manager*) > SHA256SUMS-binaries

          cat SHA256SUMS SHA256SUMS-binaries
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS SHA256SUMS-binaries
