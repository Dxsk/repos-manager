name: Check Links

on:
  push:
    branches: [main]
    paths: ['**.md', 'site/**', '.github/workflows/links.yml']
  pull_request:
    branches: [main]
    paths: ['**.md', 'site/**']
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 10:00 Europe/Paris
  workflow_dispatch:

jobs:
  check-markdown:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --timeout 30 --accept '200..=399,429' --exclude 'gnu\.org|x\.com' '**/*.md'
          fail: true

  check-site:
    name: Site links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      - run: pnpm run build
        working-directory: site

      - name: Check links in built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --timeout 30 --accept '200..=399,429' --exclude 'gnu\.org|x\.com' --root-dir site/_site 'site/_site/**/*.html'
          fail: true
