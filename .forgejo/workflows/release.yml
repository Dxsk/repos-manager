# Forgejo release: on a pushed v* tag, cross-compile from a single Linux runner
# and publish a Forgejo release. macOS and Windows ARM builds are only produced
# by the GitHub mirror (.github/workflows/release.yml), which needs native runners.
name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds the release of an existing tag with the workflow from the
  # default branch, e.g. after fixing a build failure.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.0
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    # Assumes an x86_64 host.
    runs-on: ubuntu-latest
    container:
      image: node:lts-trixie
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Resolve the tag commit
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install toolchains
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-mingw-w64-x86-64 nsis jq zip
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build
        env:
          # Rust's musl targets are self-contained; the GNU cross gcc only links.
          # ring compiles C, so the aarch64 cross compiler is needed for it too.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu; do
            cargo build --release --locked --target "$target"
          done

      - name: Package
        run: |
          set -eu
          version="${TAG#v}"
          out=dist/release
          mkdir -p "$out"

          bins=$(mktemp -d)
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu; do
            bin=repos-manager
            case "$target" in *windows*) bin=repos-manager.exe ;; esac
            stage=$(mktemp -d)
            cp LICENSE readme.md "target/$target/release/$bin" "$stage/"
            case "$target" in
              *windows*) (cd "$stage" && zip -q "$OLDPWD/$out/repos-manager-$target.zip" LICENSE readme.md "$bin") ;;
              *)         tar -czf "$out/repos-manager-$target.tar.gz" -C "$stage" LICENSE readme.md "$bin" ;;
            esac
            mkdir -p "$bins/$target"
            cp "$stage/$bin" "$bins/$target/"
          done

          makensis -V2 "-DVERSION=$version" "-DVIVERSION=${version%%[-+]*}.0" -DARCH=x86_64 \
            "-DBINARY=$PWD/target/x86_64-pc-windows-gnu/release/repos-manager.exe" \
            "-DOUTFILE=$PWD/$out/repos-manager-x86_64-setup.exe" \
            installers/repos-manager.nsi

          # SHA256SUMS covers the downloads, SHA256SUMS-binaries the binary
          # inside each archive, listed as <target>/<binary>.
          (cd "$out" && sha256sum repos-manager-* > SHA256SUMS)
          (cd "$bins" && sha256sum */repos-manager*) > "$out/SHA256SUMS-binaries"
          cat "$out/SHA256SUMS" "$out/SHA256SUMS-binaries"

      # override: a release that already exists for this tag (a re-run, or a
      # tag pushed again after a fix) is deleted and published again.
      - uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          tag: ${{ env.TAG }}
          sha: ${{ steps.tag.outputs.sha }}
          release-dir: dist/release
          override: true
