name: Auto Version

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'site/**'
      - 'docs/**'
  workflow_dispatch:

# Bumps the version from conventional commits since the last tag, updates
# CHANGELOG.md, then pushes the bump commit and the tag. The tag push starts
# release.yml here, and mirror.yml forwards main and the tag to GitHub.
#
# RELEASE_TOKEN (a personal access token with repository write scope) is
# required: pushes made with the automatic token do not trigger workflows,
# so no release would run.
jobs:
  bump:
    name: Bump version and tag
    runs-on: docker
    container:
      image: rust:1-bookworm
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    defaults:
      run:
        shell: bash
    env:
      TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        run: |
          [[ -n "$TOKEN" ]] || { echo "RELEASE_TOKEN secret is not set" >&2; exit 1; }
          git config --global --add safe.directory "$PWD"
          git config --global http.extraHeader "Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          git clone -q --branch main "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .

      - name: Get latest tag
        id: tag
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [[ -z "$tag" ]]; then
            # No tags yet: use the Cargo.toml version as baseline.
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$tag" >> "$GITHUB_OUTPUT"

      - name: Determine bump type from commits
        id: bump
        run: |
          if [[ "${{ steps.tag.outputs.baseline }}" == "true" ]]; then
            commits=$(git log --pretty=format:"%s")
          else
            commits=$(git log "${{ steps.tag.outputs.latest }}..HEAD" --pretty=format:"%s")
          fi

          bump="none"
          while IFS= read -r msg; do
            [[ -z "$msg" ]] && continue
            if grep -qE '^feat(\(.*\))?!:|BREAKING CHANGE' <<< "$msg"; then
              bump="major"
              break
            elif grep -qE '^feat(\(.*\))?:' <<< "$msg"; then
              bump="minor"
            elif grep -qE '^fix(\(.*\))?:' <<< "$msg" && [[ "$bump" == "none" ]]; then
              bump="patch"
            fi
          done <<< "$commits"

          echo "type=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: version
        run: |
          latest="${{ steps.tag.outputs.latest }}"
          latest="${latest#v}"
          IFS='.' read -r major minor patch <<< "${latest%%[-+]*}"
          new=""
          case "${{ steps.bump.outputs.type }}" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="${major}.$((minor + 1)).0" ;;
            patch) new="${major}.${minor}.$((patch + 1))" ;;
          esac

          # A version set by hand in Cargo.toml (untagged and higher) wins
          # over the computed bump, e.g. 0.6.0 -> 1.0.0 for the Rust rewrite.
          highest() { printf '%s\n' "$@" | sort -V | tail -1; }
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if ! git rev-parse -q --verify "refs/tags/v${cargo_v}" >/dev/null \
            && [[ "$cargo_v" != "$latest" && "$(highest "$latest" "$cargo_v")" == "$cargo_v" ]] \
            && [[ -z "$new" || "$(highest "$new" "$cargo_v")" == "$cargo_v" ]]; then
            new="$cargo_v"
          fi

          echo "Next version: ${new:-none}"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Bump version files and CHANGELOG
        if: steps.version.outputs.new != ''
        run: |
          since="${{ steps.tag.outputs.latest }}"
          [[ "${{ steps.tag.outputs.baseline }}" == "true" ]] && since="ROOT"
          bash scripts/bump-version.sh "${{ steps.version.outputs.new }}"
          bash scripts/update-changelog.sh "${{ steps.version.outputs.new }}" "$since"

      - name: Commit, tag and push
        if: steps.version.outputs.new != ''
        run: |
          version="${{ steps.version.outputs.new }}"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions@noreply.infrasouveraine.fr"
          git add Cargo.toml Cargo.lock site/src/_data/site.json CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: bump version to v${version}"
          git tag "v${version}"
          git push origin HEAD:main "v${version}"
