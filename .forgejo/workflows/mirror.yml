name: Mirror to GitHub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A Forgejo push mirror would forward every branch. GitHub only gets main and
# release tags; a pushed tag starts the GitHub release workflow there.
#
# MIRROR_TOKEN: GitHub fine-grained PAT on Dxsk/repos-manager with
# "Contents: read and write" and "Workflows: read and write" (the latter is
# required to push changes under .github/workflows).
concurrency:
  group: mirror-github
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: docker
    container:
      image: rust:1-bookworm
    defaults:
      run:
        shell: bash
    env:
      TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
    steps:
      - name: Push main and tags
        run: |
          [[ -n "$MIRROR_TOKEN" ]] || { echo "MIRROR_TOKEN secret is not set" >&2; exit 1; }
          git config --global --add safe.directory "$PWD"
          auth="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" clone -q --bare "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          # Fast-forward only: a rejected push means GitHub diverged and needs a human.
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/Dxsk/repos-manager.git" \
            refs/heads/main:refs/heads/main 'refs/tags/v*:refs/tags/v*'
