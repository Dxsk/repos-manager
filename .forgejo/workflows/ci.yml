# Forgejo Actions CI. GitHub (fed by the push mirror) runs .github/workflows/
# instead, which also covers Windows/macOS and publishes releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Node (current LTS) is needed by the JS actions; Rust is installed below.
    container:
      image: node:lts-trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --component rustfmt,clippy,llvm-tools-preview
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-llvm-cov
        run: |
          curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: shellcheck installers/install.sh

      # Tests need a git identity for the commits they create.
      - name: Tests and coverage
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
          cargo llvm-cov --locked --summary-only
