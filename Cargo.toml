[package]
name = "repos-manager"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "One CLI to sync them all: clone and update Git repos from GitHub, GitLab, Forgejo, Bitbucket and Radicle"
license = "MIT"
repository = "https://forge.infrasouveraine.fr/dxsk/repos-manager"
homepage = "https://repos-manager.dxscloud.fr"
readme = "readme.md"
keywords = ["git", "cli", "sync", "github", "gitlab"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
flate2 = "1.1.10"
glob = "0.3.4"
rpassword = "7.5.4"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
which = "8.0.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
